<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Planificador de Asignaciones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral fija + área de trabajo; tarjetas por reunión; en móvil la barra pasa a pestañas inferiores. */
:root{
  --bg:#F4F6F8;
  --surface:#FFFFFF;
  --ink:#17212B;
  --muted:#667381;
  --line:#E2E7EC;
  --accent:#2E5E66;
  --accent-ink:#FFFFFF;
  --accent-soft:#E3EEEF;
  --warn:#A9531C;
  --warn-soft:#FBEBDF;
  --ok:#2F7A55;
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1317;--surface:#151C22;--ink:#E8EDF1;--muted:#8F9CA8;--line:#242E36;
    --accent:#8CC3C8;--accent-ink:#0E1317;--accent-soft:#1A2A2D;--warn:#EE9A62;--warn-soft:#35241A;--ok:#6FC79B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1317;--surface:#151C22;--ink:#E8EDF1;--muted:#8F9CA8;--line:#242E36;
  --accent:#8CC3C8;--accent-ink:#0E1317;--accent-soft:#1A2A2D;--warn:#EE9A62;--warn-soft:#35241A;--ok:#6FC79B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:48px;max-width:1280px;margin:0 auto;
  padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Sidebar */
.side{position:sticky;top:28px;align-self:start;display:flex;flex-direction:column;gap:32px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--font-display);font-weight:400;font-size:27px;line-height:1.1;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{background:var(--accent-soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.side-note{font-size:12.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:16px}

/* Main */
main{min-width:0;display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head h1{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,5vw,44px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.monthnav{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.monthnav button{border:0;background:none;width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.monthnav button:hover{color:var(--ink);background:var(--accent-soft)}
.monthnav span{min-width:128px;text-align:center;font-weight:600;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn svg{width:16px;height:16px}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}

.stats{display:flex;flex-wrap:wrap;gap:8px 28px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.stats .warn b{color:var(--warn)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;align-items:center;gap:14px}
.daynum{font-family:var(--font-display);font-size:52px;line-height:.9;min-width:56px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dayinfo{display:flex;flex-direction:column;min-width:0;flex:1}
.dayinfo b{font-weight:600}
.dayinfo span{font-size:13px;color:var(--muted)}
.iconbtn{border:0;background:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent)}
.iconbtn svg{width:18px;height:18px}
.rows{display:flex;flex-direction:column;gap:2px;margin-inline:-8px}
.row{display:grid;grid-template-columns:minmax(0,108px) minmax(0,1fr) auto;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:8px;border-radius:10px;width:100%}
.row:hover{background:var(--accent-soft)}
.row .lbl{font-size:12.5px;color:var(--muted);line-height:1.25}
.row .nm{font-weight:500;overflow-wrap:anywhere}
.row .nm.empty{color:var(--muted);font-weight:400;font-style:italic}
.row.bad .nm{color:var(--warn)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.7}
.flag{font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 8px}
.skipcard{align-items:flex-start;justify-content:center;gap:8px;background:transparent;border-style:dashed}
.skipcard p{color:var(--muted);font-size:14px}
.card-f{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 0}
.linkbtn:hover{color:var(--accent);text-decoration:underline}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:17px;font-weight:600}
.panel .sub{color:var(--muted);font-size:13.5px;margin-top:-10px}
.dist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 36px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 90px 22px;align-items:center;gap:10px;font-size:14px}
.drow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.drow b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Daily */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;line-height:1.2;min-width:62px}
.chip small{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chip b{font-size:18px;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.daypanel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,4vw,44px);max-width:720px;display:flex;flex-direction:column;gap:28px}
.daypanel h2{font-family:var(--font-display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.05;letter-spacing:-.015em}
.dlist{display:flex;flex-direction:column}
.ditem{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:8px 24px;align-items:baseline;padding:16px 0;border-top:1px solid var(--line)}
.ditem:first-child{border-top:0;padding-top:0}
.ditem .lbl{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ditem .who{font-size:20px;font-weight:500;display:flex;flex-wrap:wrap;gap:4px 14px}
.ditem .who span.empty{color:var(--muted);font-weight:400;font-style:italic;font-size:17px}
.ditem .who i{font-style:normal;color:var(--line)}

/* Forms & lists */
.cols{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .l{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .nm{font-weight:600;overflow-wrap:anywhere}
.li .meta{font-size:13px;color:var(--muted)}
.li.off .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.w{background:var(--warn-soft);color:var(--warn)}
.tgl{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.tgl:hover{border-color:var(--accent);color:var(--accent)}
.tgl[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.switch{position:relative;width:42px;height:24px;border-radius:99px;border:0;background:var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:92px;text-align:right}
.confirm{display:flex;align-items:center;gap:6px;font-size:13px}
.confirm .btn{padding:4px 12px;font-size:13px}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.mrow:first-child{border-top:0}
.mrow b{font-size:14px}
.mrow .tags{display:flex;flex-wrap:wrap;gap:6px}
.none{color:var(--muted);font-size:13.5px}
.empty-state{border:1px dashed var(--line);border-radius:16px;padding:48px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;color:var(--muted)}
.empty-state h2{font-family:var(--font-display);font-weight:400;font-size:30px;color:var(--ink)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,20,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;width:min(460px,100%);max-height:min(640px,88vh);display:flex;flex-direction:column;overflow:hidden}
.modal-h{padding:20px 22px 12px;display:flex;flex-direction:column;gap:4px}
.modal-h h3{font-size:17px;font-weight:600}
.modal-h p{font-size:13.5px;color:var(--muted)}
.modal-b{padding:0 22px 12px;display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.modal-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pick{display:flex;flex-direction:column;margin-inline:-10px}
.opt{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:10px;border-radius:10px;width:100%}
.opt:hover:not(:disabled){background:var(--accent-soft)}
.opt:disabled{cursor:not-allowed;opacity:.55}
.opt .nm{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.opt small{color:var(--muted);font-size:12.5px}
.opt.cur{background:var(--accent-soft)}
textarea.input{min-height:150px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.2)}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:0;padding-block:20px 96px}
  .side{position:static;gap:0;margin-bottom:22px}
  .side-note{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;flex-direction:row;background:var(--surface);border-top:1px solid var(--line);z-index:40;
    padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));gap:2px}
  .nav button{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:11.5px;align-items:center;text-align:center}
  .cols{grid-template-columns:minmax(0,1fr)}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:520px){
  .ditem{grid-template-columns:minmax(0,1fr)}
  .count{display:none}
  .mrow{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><b>Asignaciones</b><span>Congregación La Viña</span></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <p class="side-note">Reuniones los jueves y domingos. Los cambios se guardan automáticamente en este navegador.</p>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>
/* ================= Datos base ================= */
const KEY = 'planificador-asignaciones-v1';
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const REASONS = ['Trabajo','Salud','Viaje','Familia','Estudios','Otro'];
/* Departamentos tomados del Excel; Micrófonos tiene dos puestos */
const SLOTS = [
  {id:'puerta',    dept:'puerta',    label:'Acomodador Puerta',    short:'Puerta'},
  {id:'auditorio', dept:'auditorio', label:'Acomodador Auditorio', short:'Auditorio'},
  {id:'mic1',      dept:'mic',       label:'Micrófonos',           short:'Micrófono 1'},
  {id:'mic2',      dept:'mic',       label:'Micrófonos',           short:'Micrófono 2'},
  {id:'plataforma',dept:'plataforma',label:'Plataforma',           short:'Plataforma'},
  {id:'parqueo',   dept:'parqueo',   label:'Parqueo',              short:'Parqueo'},
  {id:'salon',     dept:'salon',     label:'Abrir el Salón',       short:'Abrir el Salón'}
];
const DEPTS = [];
SLOTS.forEach(s=>{let d=DEPTS.find(x=>x.id===s.dept); if(!d){d={id:s.dept,label:s.label,slots:[]};DEPTS.push(d)} d.slots.push(s.id)});
const SEED_NAMES = ['Jordi Escobar','pedro jara','Andy Garro','elpidio lopez'];

/* ================= Estado ================= */
let S;
const rid = () => Math.random().toString(36).slice(2,9);
function seed(){
  const brothers = SEED_NAMES.map((n,i)=>({id:'b'+(i+1),name:n,active:true}));
  const id = n => brothers.find(b=>b.name===n).id;
  return {
    brothers,
    restrictions:[
      {id:rid(),bid:id('pedro jara'),from:'2026-11-08',to:'',reason:'Trabajo',note:'Ejemplo: puedes eliminarlo'},
      {id:rid(),bid:id('elpidio lopez'),from:'2026-11-12',to:'2026-11-15',reason:'Viaje',note:'Ejemplo: puedes eliminarlo'}
    ],
    programs:{}, skipped:{}
  };
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const o = JSON.parse(raw); if(o && Array.isArray(o.brothers)) return o; } }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const shiftMonthKey = (k,n) => { const [y,m]=k.split('-').map(Number); return monthKey(new Date(y,m-1+n,1)); };
const monthLabel = k => { const [y,m]=k.split('-').map(Number); return `${MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)} ${y}`; };
const fmtLong = s => { const d=parse(s); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fmtShort = s => { const d=parse(s); return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function meetingDates(mk){
  const [y,m]=mk.split('-').map(Number); const out=[];
  for(let d=1; d<=31; d++){ const dt=new Date(y,m-1,d); if(dt.getMonth()!==m-1) break; if(dt.getDay()===0||dt.getDay()===4) out.push(ymd(dt)); }
  return out;
}
const bro = id => S.brothers.find(b=>b.id===id);
const broName = id => bro(id)?.name ?? '';
function restrictionOn(bid,date){ return S.restrictions.find(r=>r.bid===bid && r.from<=date && date<=(r.to||r.from)); }
const banned = (bid,dept) => (S.bans?.[bid]||[]).includes(dept);
const slotDef = id => SLOTS.find(s=>s.id===id);

/* ================= Algoritmo de distribución ================= */
/* Prioridades: (1) equidad de cargas en el mes, (2) descanso respecto a la reunión anterior,
   (3) variedad de departamento, (4) no repetir el mismo puesto en reuniones seguidas. Se respetan
   restricciones, hermanos inactivos y asignaciones fijadas a mano (si se pide conservarlas). */
function generate(mk, keepLocks){
  const old = S.programs[mk];
  const prog = {days:{}, locks:{}};
  const dates = meetingDates(mk).filter(d=>!S.skipped[d]);
  const active = S.brothers.filter(b=>b.active);
  const total={}, byDept={};
  S.brothers.forEach(b=>{total[b.id]=0; byDept[b.id]={};});
  let servedLast=new Set(), lastSlot={};
  const prev = S.programs[shiftMonthKey(mk,-1)];
  if(prev){
    const pd = Object.keys(prev.days).filter(d=>!S.skipped[d]).sort();
    const last = pd[pd.length-1];
    if(last) Object.entries(prev.days[last]).forEach(([s,id])=>{ if(id){servedLast.add(id); lastSlot[id]=s;} });
  }
  dates.forEach(d=>{ prog.days[d]={}; SLOTS.forEach(s=>prog.days[d][s.id]=null); });
  if(keepLocks && old){
    dates.forEach(d=>{
      Object.keys(old.locks?.[d]||{}).forEach(s=>{
        const id = old.days?.[d]?.[s];
        if(id){ prog.days[d][s]=id; (prog.locks[d]??={})[s]=true; total[id]=(total[id]||0)+1; const dp=slotDef(s).dept; byDept[id][dp]=(byDept[id][dp]||0)+1; }
      });
    });
  }
  let shortage=0;
  dates.forEach(d=>{
    const today = new Set(Object.values(prog.days[d]).filter(Boolean));
    const order = SLOTS.map(s=>s.id).filter(s=>!prog.days[d][s]).sort(()=>Math.random()-.5);
    order.forEach(s=>{
      const dp = slotDef(s).dept;
      const cands = active.filter(b=>!today.has(b.id) && !restrictionOn(b.id,d) && !banned(b.id,dp));
      if(!cands.length){ shortage++; return; }
      let best=null, bs=Infinity;
      cands.forEach(b=>{
        const sc = total[b.id]*10 + (servedLast.has(b.id)?6:0) + (byDept[b.id][dp]||0)*3 + (lastSlot[b.id]===s?4:0) + Math.random()*2;
        if(sc<bs){bs=sc;best=b;}
      });
      prog.days[d][s]=best.id; today.add(best.id);
      total[best.id]++; byDept[best.id][dp]=(byDept[best.id][dp]||0)+1;
    });
    servedLast = new Set(Object.values(prog.days[d]).filter(Boolean));
    lastSlot = {}; Object.entries(prog.days[d]).forEach(([s,id])=>{ if(id) lastSlot[id]=s; });
  });
  S.programs[mk]=prog; save();
  return {shortage};
}

/* ================= Utilidades de programa ================= */
function monthCounts(mk){
  const c={}; const p=S.programs[mk]; if(!p) return c;
  Object.entries(p.days).forEach(([d,day])=>{ if(S.skipped[d]) return; Object.values(day).forEach(id=>{ if(id) c[id]=(c[id]||0)+1; }); });
  return c;
}
function cellIssue(date,slot,id){
  if(!id) return '';
  const b=bro(id); if(!b) return 'Hermano eliminado';
  const r=restrictionOn(id,date); if(r) return `No disponible: ${r.reason}`;
  if(banned(id,slotDef(slot).dept)) return 'No realiza este puesto';
  if(!b.active) return 'Hermano inactivo';
  return '';
}
function programStats(mk){
  const p=S.programs[mk]; let filled=0, empty=0, issues=0;
  if(!p) return {filled,empty,issues,meetings:0};
  const dates=meetingDates(mk).filter(d=>!S.skipped[d]);
  dates.forEach(d=>SLOTS.forEach(s=>{ const id=p.days[d]?.[s.id]; if(id){filled++; if(cellIssue(d,s.id,id)) issues++;} else empty++; }));
  return {filled,empty,issues,meetings:dates.length};
}
function assign(date,slot,bid){
  const mk=date.slice(0,7);
  const p = S.programs[mk] ??= {days:{},locks:{}};
  const day = p.days[date] ??= Object.fromEntries(SLOTS.map(s=>[s.id,null]));
  const locks = p.locks[date] ??= {};
  if(bid){
    const other = SLOTS.map(s=>s.id).find(s=>s!==slot && day[s]===bid);
    if(other){ day[other]=day[slot]; if(day[slot]) locks[other]=true; else delete locks[other]; }
    day[slot]=bid; locks[slot]=true;
  }else{ day[slot]=null; delete locks[slot]; }
  save();
}
function dayText(date){
  const day=S.programs[date.slice(0,7)]?.days[date]||{};
  const lines=[fmtLong(date)];
  DEPTS.forEach(dp=>{ const names=dp.slots.map(s=>broName(day[s])).filter(Boolean); lines.push(`${dp.label}: ${names.join(' y ')||'—'}`); });
  return lines.join('\n');
}

      <div class="modal-h"><h3>Copia de seguridad</h3><p>Guarda este texto en un lugar seguro. Para restaurar, pega uno anterior y pulsa Restaurar.</p></div>
      <div class="modal-b"><textarea id="bk" class="input">${esc(JSON.stringify(S))}</textarea></div>
      <div class="modal-f"><div class="tools"><button class="btn small" data-a="copybackup">Copiar</button><button class="btn small" data-a="restore">Restaurar</button></div><button class="btn small ghost" data-a="close">Cerrar</button></div></div></div>`;
  }
  return '';
}
function pickList(date,slot,q){
  const p=S.programs[date.slice(0,7)], day=p?.days[date]||{}, cur=day[slot], counts=monthCounts(date.slice(0,7));
  const norm=s=>s.toLowerCase();
  let items=S.brothers.filter(b=>(b.active||b.id===cur) && (!q||norm(b.name).includes(norm(q)))).map(b=>{
    const r=restrictionOn(b.id,date);
    const other=SLOTS.find(x=>x.id!==slot && day[x.id]===b.id);
    const ban=banned(b.id,slotDef(slot).dept);
    return {b,r,ban,other,rank:(r||ban)?2:(other?1:0)};
  });
  items.sort((x,y)=>x.rank-y.rank || (counts[x.b.id]||0)-(counts[y.b.id]||0) || x.b.name.localeCompare(y.b.name,'es'));
  if(!items.length) return '<p class="none" style="padding:10px">Sin resultados.</p>';
  return items.map(({b,r,ban,other})=>{
    const note = ban ? 'No realiza este puesto' : r ? `No disponible · ${esc(r.reason)}` : other ? `Ya en ${esc(other.short)}, se intercambia` : `${counts[b.id]||0} este mes`;
    return `<button class="opt ${b.id===cur?'cur':''}" data-a="pickbro" data-id="${b.id}" ${(r||ban)?'disabled':''}><span class="nm">${esc(b.name)}</span><small>${note}</small></button>`;
  }).join('');
}

/* ================= Render ================= */
function render(){
  const ae=document.activeElement, fid=ae&&ae.id, fs=ae&&ae.selectionStart;
  document.getElementById('nav').innerHTML = VIEWS.map(([id,label,ic])=>`<button data-a="nav" data-v="${id}" ${ui.view===id?'aria-current="page"':''}>${ICON[ic]}<span>${label}</span></button>`).join('');
  const v={programa:viewPrograma,dia:viewDia,disp:viewDisp,hermanos:viewHermanos}[ui.view];
  document.getElementById('main').innerHTML = v();
  document.getElementById('modal-root').innerHTML = modalHtml();
  if(fid){ const el=document.getElementById(fid); if(el){ el.focus(); try{ if(fs!=null) el.setSelectionRange(fs,fs);}catch(e){} } }
}

/* ================= Eventos ================= */
const A = {
  nav(t){ ui.view=t.dataset.v; ui.confirmDel=null; window.scrollTo(0,0); },
  month(t){ ui.month=shiftMonthKey(ui.month,+t.dataset.n); ui.day=null; },
  generate(){
    const had=!!S.programs[ui.month];
    const r=generate(ui.month, ui.keep);
    toast(r.shortage ? `Programa generado. ${r.shortage} puestos quedaron vacíos por falta de hermanos disponibles.` : (had?'Programa regenerado.':'Programa generado.'));
  },
  keep(t){ ui.keep=t.checked; },
  cell(t){ ui.modal={type:'pick',date:t.dataset.d,slot:t.dataset.s}; },
  pickbro(t){ const m=ui.modal; assign(m.date,m.slot,t.dataset.id); ui.modal=null; toast('Asignación actualizada.'); },
  clearcell(){ const m=ui.modal; assign(m.date,m.slot,null); ui.modal=null; toast('Puesto sin asignar.'); },
  close(){ ui.modal=null; },
  scrim(t,e){ if(e.target===t) ui.modal=null; else return false; },
  openday(t){ ui.day=t.dataset.d; ui.view='dia'; window.scrollTo(0,0); },
  selday(t){ ui.day=t.dataset.d; },
  skip(t){ ui.modal={type:'skip',date:t.dataset.d}; },
  unskip(t){ delete S.skipped[t.dataset.d]; save(); toast('Reunión restablecida. Regenera para completar sus puestos.'); },
  copyday(t){
    const txt=dayText(t.dataset.d);
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Texto copiado.')).catch(()=>{ui.modal={type:'text',text:txt};render();});
    return false;
  },
  togglebro(t){ const b=bro(t.dataset.id); b.active=!b.active; save(); },
  delbro(t){ ui.confirmDel=t.dataset.id; },
  'delbro-no'(){ ui.confirmDel=null; },
  'delbro-yes'(t){
    const id=t.dataset.id;
    S.brothers=S.brothers.filter(b=>b.id!==id);
    S.restrictions=S.restrictions.filter(r=>r.bid!==id); delete S.bans[id];
    Object.values(S.programs).forEach(p=>Object.values(p.days).forEach(day=>Object.keys(day).forEach(s=>{ if(day[s]===id) day[s]=null; })));
    ui.confirmDel=null; save(); toast('Hermano eliminado.');
  },
  delres(t){ S.restrictions=S.restrictions.filter(r=>r.id!==t.dataset.id); save(); toast('Excepción eliminada.'); },
  toggleban(t){
    const b=t.dataset.b, d=t.dataset.dp, arr=(S.bans[b] ??= []), i=arr.indexOf(d);
    if(i>=0) arr.splice(i,1); else arr.push(d);
    if(!arr.length) delete S.bans[b]; save();
    const st=programStats(ui.month);
    toast(i>=0?'Restricción quitada.':(st.issues?`Guardado. ${st.issues} asignación(es) en conflicto: edítalas o regenera el programa.`:'Puesto restringido.'));
  },
  clearban(t){ delete S.bans[t.dataset.b]; save(); toast('Restricciones de puestos quitadas.'); },
  exp(t){
    const f=t.dataset.f;
    if(t.dataset.k==='day') exportDay(t.dataset.d,f); else exportMonth(ui.month,f);
    return false;
  },
  backup(){ ui.modal={type:'backup'}; },
  copybackup(){
    const v=document.getElementById('bk').value;
    (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Copia guardada en el portapapeles.')).catch(()=>{document.getElementById('bk').select();toast('Selecciona el texto y cópialo.');});
    return false;
  },
  restore(){
    try{ const o=JSON.parse(document.getElementById('bk').value); if(!o||!Array.isArray(o.brothers)||!Array.isArray(o.restrictions)||typeof o.programs!=='object') throw 0;
      S={skipped:{},bans:{},...o}; save(); ui.modal=null; toast('Datos restaurados.'); }
    catch(e){ toast('El texto no es una copia válida.'); return false; }
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const fn=A[t.dataset.a]; if(!fn) return;
  if(t.tagName==='INPUT' && t.type==='checkbox'){ fn(t,e); return; }
  if(fn(t,e)===false) return;
  render();
});
document.addEventListener('change',e=>{
  if(e.target.dataset.c==='banbro'){ ui.banBro=e.target.value; render(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.i==='search'){ ui.search=t.value; render(); }
  if(t.dataset.i==='pq'){ document.getElementById('pick-list').innerHTML=pickList(ui.modal.date,ui.modal.slot,t.value.trim()); }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const kind=f.dataset.form;
  if(kind==='addbro'){
    const name=document.getElementById('nb').value.trim().replace(/\s+/g,' ');
    if(!name) return;
    if(S.brothers.some(b=>b.name.toLowerCase()===name.toLowerCase())){ toast('Ese hermano ya está en la lista.'); return; }
    S.brothers.push({id:rid(),name,active:true}); save(); toast(`${name} agregado.`); render();
    document.getElementById('nb')?.focus();
  }
  if(kind==='addres'){
    const bid=document.getElementById('r-b').value, from=document.getElementById('r-from').value, to=document.getElementById('r-to').value;
    if(!from) return;
    if(to && to<from){ toast('La fecha final debe ser igual o posterior a la inicial.'); return; }
    S.restrictions.push({id:rid(),bid,from,to:to&&to!==from?to:'',reason:document.getElementById('r-reason').value,note:document.getElementById('r-note').value.trim()});
    save();
    const st=programStats(ui.month);
    toast(st.issues?`Guardado. ${st.issues} asignación(es) en conflicto: edítalas o regenera el programa.`:'Fechas bloqueadas.');
    render();
  }
  if(kind==='skip'){
    const m=ui.modal; S.skipped[m.date]=document.getElementById('sk').value.trim()||'Sin reunión'; save(); ui.modal=null; toast('Día marcado sin reunión.'); render();
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && ui.modal){ ui.modal=null; render(); } });

/* ================= Exportación (imagen y PDF) ================= */
const X = {bg:'#FFFFFF',ink:'#17212B',muted:'#667381',line:'#E2E7EC',accent:'#2E5E66',soft:'#E3EEEF',warn:'#A9531C',
  disp:"'Instrument Serif',Georgia,'Times New Roman',serif", body:"'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif"};
async function saveFile(filename,data){
  let dl=null; try{ dl=await window.claude?.use?.('downloads'); }catch(e){}
  if(!dl){ toast('La descarga no está disponible en esta vista.'); return; }
  try{ await dl.save({filename,data}); toast('Archivo listo.'); }
  catch(e){ if(e&&e.code==='declined') return; toast('No se pudo guardar el archivo.'); }
}
async function loadFonts(){
  try{ await Promise.all(["400 40px 'Instrument Serif'","500 20px 'Hanken Grotesk'","600 20px 'Hanken Grotesk'"].map(f=>document.fonts.load(f))); }catch(e){}
}
function mkCanvas(w,h,scale){
  const c=document.createElement('canvas'); c.width=w*scale; c.height=h*scale;
  const g=c.getContext('2d'); g.scale(scale,scale); g.fillStyle=X.bg; g.fillRect(0,0,w,h); g.textBaseline='alphabetic'; return [c,g];
}
function setFont(g,size,weight,fam,style){ g.font=`${style||''} ${weight} ${size}px ${fam}`.trim(); }
function fitText(g,text,maxW,size,weight,fam,style,min=12){
  let s=size; setFont(g,s,weight,fam,style);
  while(g.measureText(text).width>maxW && s>min){ s--; setFont(g,s,weight,fam,style); }
}
function spaced(g,on){ try{ g.letterSpacing=on?'2px':'0px'; }catch(e){} }
function stamp(){ const d=new Date(); return `Generado el ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; }

function drawDay(date){
  const W=1080,H=1350,M=90; const [c,g]=mkCanvas(W,H,2);
  const skip=S.skipped[date], day=S.programs[date.slice(0,7)]?.days[date]||{};
  g.fillStyle=X.muted; setFont(g,22,600,X.body); spaced(g,true); g.fillText('CONGREGACIÓN LA VIÑA · ASIGNACIONES',M,140); spaced(g,false);
  g.fillStyle=X.ink; fitText(g,fmtLong(date),W-2*M,96,400,X.disp); g.fillText(fmtLong(date),M,270);
  g.fillStyle=X.line; g.fillRect(M,320,W-2*M,2);
  if(skip){
    g.fillStyle=X.warn; setFont(g,44,600,X.body); g.fillText('Sin reunión',M,470);
    g.fillStyle=X.muted; fitText(g,skip,W-2*M,32,400,X.body); g.fillText(skip,M,525);
  }else{
    let y=360; const rh=130;
    DEPTS.forEach((dp,i)=>{
      g.fillStyle=X.muted; setFont(g,21,600,X.body); spaced(g,true); g.fillText(dp.label.toUpperCase(),M,y+42); spaced(g,false);
      const names=dp.slots.map(s=>broName(day[s])).filter(Boolean);
      const txt=names.join('  /  ');
      if(txt){ g.fillStyle=X.ink; fitText(g,txt,W-2*M,46,500,X.body); g.fillText(txt,M,y+98); }
      else{ g.fillStyle=X.muted; setFont(g,38,400,X.body,'italic'); g.fillText('Sin asignar',M,y+98); }
      if(i<DEPTS.length-1){ g.fillStyle=X.line; g.fillRect(M,y+rh-2,W-2*M,2); }
      y+=rh;
    });
  }
  g.fillStyle=X.muted; setFont(g,20,400,X.body); g.fillText(stamp(),M,H-70);
  return c;
}
function drawMonth(mk){
  const p=S.programs[mk], dates=meetingDates(mk);
  const W=1800,M=70,top=210,hh=64,rh=70,H=top+hh+dates.length*rh+110; const [c,g]=mkCanvas(W,H,2);
  g.fillStyle=X.muted; setFont(g,21,600,X.body); spaced(g,true); g.fillText('PROGRAMA DE DEPARTAMENTOS · CONGREGACIÓN LA VIÑA',M,92); spaced(g,false);
  g.fillStyle=X.ink; setFont(g,76,400,X.disp); g.fillText(monthLabel(mk),M,170);
  const fw=160, dw=140, cw=(W-2*M-fw-dw)/SLOTS.length;
  const xs=[M, M+fw, ...SLOTS.map((_,i)=>M+fw+dw+i*cw)];
  g.fillStyle=X.soft; g.fillRect(M,top,W-2*M,hh);
  g.fillStyle=X.accent; setFont(g,20,600,X.body); g.textAlign='left';
  g.fillText('Fecha',xs[0]+16,top+40); g.fillText('Día',xs[1]+16,top+40);
  DEPTS.forEach(dp=>{
    const i=SLOTS.findIndex(s=>s.id===dp.slots[0]), x=xs[2+i], w=cw*dp.slots.length;
    g.textAlign='center'; fitText(g,dp.label,w-20,20,600,X.body); g.fillText(dp.label,x+w/2,top+40);
  });
  g.textAlign='left';
  dates.forEach((d,r)=>{
    const y=top+hh+r*rh, dt=parse(d), skip=S.skipped[d], day=p?.days[d]||{};
    g.fillStyle=X.line; g.fillRect(M,y+rh-1,W-2*M,2);
    g.fillStyle=X.ink; setFont(g,22,600,X.body); g.fillText(`${pad(dt.getDate())}/${pad(dt.getMonth()+1)}/${dt.getFullYear()}`,xs[0]+16,y+43);
    g.fillStyle=X.muted; setFont(g,22,400,X.body); g.fillText(DIAS[dt.getDay()],xs[1]+16,y+43);
    if(skip){
      g.fillStyle=X.warn; g.textAlign='center'; fitText(g,`Sin reunión · ${skip}`,cw*SLOTS.length-40,22,600,X.body); g.fillText(`Sin reunión · ${skip}`,xs[2]+cw*SLOTS.length/2,y+43); g.textAlign='left';
    }else SLOTS.forEach((s,i)=>{
      const n=broName(day[s.id]); g.textAlign='center';
      if(n){ g.fillStyle=X.ink; fitText(g,n,cw-24,22,500,X.body); g.fillText(n,xs[2+i]+cw/2,y+43); }
      else{ g.fillStyle=X.muted; setFont(g,22,400,X.body); g.fillText('—',xs[2+i]+cw/2,y+43); }
      g.textAlign='left';
    });
  });
  g.fillStyle=X.muted; setFont(g,19,400,X.body); g.fillText(stamp(),M,H-44);
  return c;
}
/* PDF mínimo de una página con la imagen JPEG incrustada */
function jpegToPdf(jpeg,w,h,pw,ph){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=x=>{ const b=typeof x==='string'?enc.encode(x):x; parts.push(b); len+=b.length; };
  const num=n=>n.toFixed(2);
  push('%PDF-1.4\n');
  const begin=n=>{ offs[n]=len; push(`${n} 0 obj\n`); };
  begin(1); push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  begin(2); push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  begin(3); push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${num(pw)} ${num(ph)}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>\nendobj\n`);
  begin(4); push(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`); push(jpeg); push('\nendstream\nendobj\n');
  const content=`q ${num(pw)} 0 0 ${num(ph)} 0 0 cm /Im0 Do Q`;
  begin(5); push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  const xref=len; push('xref\n0 6\n0000000000 65535 f \n');
  for(let n=1;n<=5;n++) push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  const out=new Uint8Array(len); let o=0; parts.forEach(b=>{ out.set(b,o); o+=b.length; }); return out;
}
const toBlob=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
async function deliver(c,fmt,name,pageW){
  if(fmt==='png'){ const b=await toBlob(c,'image/png'); await saveFile(name+'.png',b); return; }
  const jb=await toBlob(c,'image/jpeg',.93), bytes=new Uint8Array(await jb.arrayBuffer());
  const pdf=jpegToPdf(bytes,c.width,c.height,pageW,pageW*c.height/c.width);
  await saveFile(name+'.pdf',new Blob([pdf],{type:'application/pdf'}));
}
async function exportDay(date,fmt){
  const mk=date.slice(0,7);
  if(!S.programs[mk] && !S.skipped[date]){ toast('Genera primero el programa de este mes.'); return; }
  await loadFonts(); await deliver(drawDay(date),fmt,`Asignaciones-${date}`,595);
}
async function exportMonth(mk,fmt){
  if(!S.programs[mk]){ toast('Genera primero el programa de este mes.'); return; }
  await loadFonts(); await deliver(drawMonth(mk),fmt,`Programa-${mk}`,842);
}

/* ================= Inicio ================= */
S = load();
if(!S){ S=seed(); generate(ui.month,false); }
S.skipped ??= {}; S.bans ??= {}; S.programs ??= {};
render();
</script>
